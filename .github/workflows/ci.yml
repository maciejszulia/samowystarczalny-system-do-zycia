name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the example database and compare the results with README.md
        working-directory: database
        run: python3 check.py --check
